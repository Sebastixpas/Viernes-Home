<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="940" fill="#f6f7fb"/>
  <text x="500" y="45" font-size="30" font-weight="bold" text-anchor="middle" fill="#1b2a49">Viernes: conexiones del LED y el botón</text>
  <text x="500" y="75" font-size="17" text-anchor="middle" fill="#555">Haz todo con el cable USB DESCONECTADO</text>

  <!-- Riel GND -->
  <line x1="70" y1="190" x2="70" y2="720" stroke="#1565c0" stroke-width="10" stroke-linecap="round"/>
  <text x="25" y="158" font-size="16" font-weight="bold" text-anchor="start" fill="#1565c0">COLUMNA AZUL (−)</text>
  <text x="25" y="177" font-size="14" text-anchor="start" fill="#1565c0">= GND</text>

  <!-- ESP32 -->
  <rect x="520" y="100" width="220" height="660" rx="14" fill="#2b2f3a" stroke="#111" stroke-width="3"/>
  <rect x="560" y="115" width="140" height="110" rx="6" fill="#9aa3b2"/>
  <text x="630" y="165" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">ANTENA</text>
  <text x="630" y="187" font-size="14" text-anchor="middle" fill="#222">(arriba)</text>
  <rect x="565" y="700" width="60" height="38" rx="6" fill="#c9ced8" stroke="#888" stroke-width="2"/>
  <rect x="635" y="700" width="60" height="38" rx="6" fill="#c9ced8" stroke="#888" stroke-width="2"/>
  <text x="630" y="755" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">USB-C (abajo)</text>
  <text x="630" y="470" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">ESP32-S3</text>
  <text x="630" y="495" font-size="14" text-anchor="middle" fill="#cfd4de">hilera izquierda ◄</text>

  <!-- pines (hilera izquierda) -->
  <g font-size="15" fill="#cfd4de">
    <circle cx="520" cy="150" r="7" fill="#bbb"/><text x="540" y="155">3V3</text>
    <circle cx="520" cy="180" r="7" fill="#bbb"/><text x="540" y="185">3V3</text>
    <circle cx="520" cy="210" r="7" fill="#bbb"/><text x="540" y="215">RST</text>
    <circle cx="520" cy="315" r="7" fill="#bbb"/><text x="540" y="320">6</text>
    <text x="540" y="355">... (otros pines)</text>
    <circle cx="520" cy="640" r="7" fill="#bbb"/><text x="540" y="645">5V</text>
  </g>
  <circle cx="520" cy="250" r="11" fill="#ffd600" stroke="#fff" stroke-width="2"/>
  <text x="545" y="257" font-size="22" font-weight="bold" fill="#ffd600">4</text>
  <circle cx="520" cy="285" r="11" fill="#43d17a" stroke="#fff" stroke-width="2"/>
  <text x="545" y="292" font-size="22" font-weight="bold" fill="#43d17a">5</text>
  <circle cx="520" cy="680" r="11" fill="#42a5f5" stroke="#fff" stroke-width="2"/>
  <text x="545" y="687" font-size="22" font-weight="bold" fill="#42a5f5">GND (G)</text>

  <!-- Cable pin 4 -> resistencia -> LED -> GND -->
  <line x1="520" y1="250" x2="400" y2="250" stroke="#e6b800" stroke-width="7" stroke-linecap="round"/>
  <rect x="290" y="236" width="110" height="28" rx="6" fill="#e8d3a8" stroke="#8a6d2f" stroke-width="2"/>
  <rect x="312" y="236" width="9" height="28" fill="#a33"/>
  <rect x="332" y="236" width="9" height="28" fill="#a33"/>
  <rect x="352" y="236" width="9" height="28" fill="#6b3d1a"/>
  <text x="345" y="226" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">Resistencia</text>
  <text x="345" y="290" font-size="13" text-anchor="middle" fill="#555">220 Ω o 330 Ω</text>
  <line x1="290" y1="250" x2="252" y2="250" stroke="#e6b800" stroke-width="7" stroke-linecap="round"/>

  <circle cx="205" cy="250" r="30" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
  <text x="205" y="256" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">LED</text>
  <line x1="235" y1="250" x2="252" y2="250" stroke="#999" stroke-width="5"/>
  <line x1="175" y1="250" x2="140" y2="250" stroke="#999" stroke-width="5"/>
  <text x="235" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#c62828">pata LARGA (+)</text>
  <text x="235" y="221" font-size="13" text-anchor="middle" fill="#c62828">lado resistencia</text>
  <text x="150" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">pata CORTA (−)</text>
  <text x="150" y="321" font-size="13" text-anchor="middle" fill="#1565c0">lado GND</text>
  <line x1="140" y1="250" x2="70" y2="250" stroke="#1565c0" stroke-width="7" stroke-linecap="round"/>
  <circle cx="70" cy="250" r="9" fill="#1565c0"/>

  <!-- Cable pin 5 -> botón -> GND -->
  <polyline points="520,285 460,285 460,430 380,430" fill="none" stroke="#2e9e5b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="250" y="400" width="130" height="60" rx="8" fill="#37474f" stroke="#111" stroke-width="3"/>
  <circle cx="315" cy="430" r="19" fill="#cfd8dc" stroke="#111" stroke-width="3"/>
  <text x="315" y="386" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">BOTÓN que se queda hundido</text>
  <text x="315" y="486" font-size="13" text-anchor="middle" fill="#555">usa 2 patas (una de cada lado)</text>
  <line x1="250" y1="430" x2="70" y2="430" stroke="#1565c0" stroke-width="7" stroke-linecap="round"/>
  <circle cx="70" cy="430" r="9" fill="#1565c0"/>

  <!-- Cable GND -->
  <line x1="520" y1="680" x2="70" y2="680" stroke="#1565c0" stroke-width="7" stroke-linecap="round"/>
  <circle cx="70" cy="680" r="9" fill="#1565c0"/>
  <text x="290" y="665" font-size="15" font-weight="bold" text-anchor="middle" fill="#1565c0">cable de GND del ESP32 a la columna azul</text>

  <!-- Leyenda -->
  <rect x="760" y="100" width="215" height="270" rx="12" fill="#fff" stroke="#c9ced8" stroke-width="2"/>
  <text x="775" y="130" font-size="17" font-weight="bold" fill="#1b2a49">Colores de cables</text>
  <line x1="775" y1="155" x2="820" y2="155" stroke="#e6b800" stroke-width="7" stroke-linecap="round"/>
  <text x="830" y="160" font-size="15" fill="#333">pin 4 → LED</text>
  <line x1="775" y1="190" x2="820" y2="190" stroke="#2e9e5b" stroke-width="7" stroke-linecap="round"/>
  <text x="830" y="195" font-size="15" fill="#333">pin 5 → botón</text>
  <line x1="775" y1="225" x2="820" y2="225" stroke="#1565c0" stroke-width="7" stroke-linecap="round"/>
  <text x="830" y="230" font-size="15" fill="#333">todo GND (−)</text>
  <text x="775" y="275" font-size="14" fill="#555">Los colores son solo</text>
  <text x="775" y="295" font-size="14" fill="#555">una guía: puedes usar</text>
  <text x="775" y="315" font-size="14" fill="#555">los cables que tengas.</text>
  <text x="775" y="345" font-size="14" fill="#c62828">NO uses la columna roja (+)</text>

  <!-- Resumen -->
  <rect x="40" y="780" width="920" height="130" rx="12" fill="#fff" stroke="#c9ced8" stroke-width="2"/>
  <text x="60" y="812" font-size="17" font-weight="bold" fill="#1b2a49">Resumen</text>
  <text x="60" y="842" font-size="16" fill="#333">1) Pin 4 → resistencia → pata LARGA del LED → pata CORTA del LED → columna azul (−)</text>
  <text x="60" y="870" font-size="16" fill="#333">2) Pin 5 → una pata del botón → otra pata del botón → columna azul (−)</text>
  <text x="60" y="898" font-size="16" fill="#333">3) Pin GND del ESP32 → columna azul (−)      Después conecta el USB-C al puerto UART/COM</text>
</svg>
